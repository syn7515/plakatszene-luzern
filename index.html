<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll Call — a poster showcase after Plakatszene Luzern</title>
    <meta name="description" content="A poster for a poster exhibition, rebuilt as an interactive showcase." />
    <!-- How a shared link shows. The page is seen at suepark.xyz/experiments/1,
         so the URLs are spelled out in full; the image is drawn by
         scripts/og.mjs, which renames it whenever it changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sue Park" />
    <meta property="og:url" content="https://suepark.xyz/experiments/1" />
    <meta property="og:title" content="Roll Call — a poster showcase after Plakatszene Luzern" />
    <meta property="og:description" content="A poster for a poster exhibition, rebuilt as an interactive showcase." />
    <meta property="og:image" content="https://suepark.xyz/experiments/1/og-image-16a7a6e2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="A rolled sheet in teal and vermilion, printed with “Roll Call”, among rolled sheets gone grey" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roll Call — a poster showcase after Plakatszene Luzern" />
    <meta name="twitter:description" content="A poster for a poster exhibition, rebuilt as an interactive showcase." />
    <meta name="twitter:image" content="https://suepark.xyz/experiments/1/og-image-16a7a6e2.png" />
    <meta name="twitter:image:alt" content="A rolled sheet in teal and vermilion, printed with “Roll Call”, among rolled sheets gone grey" />
    <!-- In the head, not imported by the script: the page is never painted
         without it, however long the script takes to arrive. -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Fetched alongside the script: the labels on the paper wait for them (main.ts). -->
    <link rel="preload" href="/fonts/ABCAreal-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ABCAreal-Medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <main>
      <div class="work">
        <div class="poster-frame">
          <canvas id="poster" aria-label="Roll Call: rolled posters, after Plakatszene Luzern"></canvas>
        </div>
        <!-- The wall beside the poster: a line of wall text, and the label
             with the exhibition photo tucked behind it (caption.ts). -->
        <aside class="caption" aria-label="About this poster">
          <p class="about">A poster for a poster exhibition, rebuilt as an interactive showcase.</p>
          <div class="label">
            <button class="print" type="button" aria-expanded="false" aria-label="Photo of the original poster">
              <span class="paper">
                <img
                  src="/photo-seoul-2026-small.jpg"
                  data-full="/photo-seoul-2026.webp"
                  width="360"
                  height="480"
                  alt="The printed poster, held to a plan chest by four magnets, at the Seoul exhibition"
                />
                <span class="note">
                  <span>
                    <span class="place">Doosung Paper Gallery, Seoul</span>
                    <span class="when">October 2026</span>
                  </span>
                </span>
              </span>
            </button>
            <p class="kind">Original poster</p>
            <div class="card">
              <h1>Plakatszene Luzern <span class="year">(2025)</span></h1>
              <p>Isabelle Mauchle, Felix Pfäffli, Erich Brechbühl</p>
              <p class="dim">For the Plakatsammlung der Schule für Gestaltung Basel</p>
              <a class="link" href="https://100-beste-plakate.de/plakate/plakatszene-luzern/" target="_blank" rel="noopener"
                >Full credits ↗</a
              >
            </div>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
